workflows:
  
  android-release:
    name: Manager Assistant - APK Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - gemini_keys # اسم مجموعة المتغيرات في Codemagic
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release --verbose
          # لو حابب تدمج الـ API Key وقت البناء استخدم السطر التالي بدلا من اللي فوق
          # flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your_email@gmail.com
        notify:
          success: true
          failure: true
